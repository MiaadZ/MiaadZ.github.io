name: Publish Security Notebook

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy from main after successful validation
        type: boolean
        required: false
        default: false

permissions: {}

env:
  BUNDLE_FROZEN: 'true'
  JEKYLL_ENV: production

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    concurrency:
      group: pages-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read Pages metadata for publication
        id: pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false # Activation remains a manual repository setting.
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          bundler: Gemfile.lock
          bundler-cache: true
      - name: Build production site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path || '' }}
        run: bundle exec jekyll build --trace --destination _site --baseurl "$PAGES_BASE_PATH"
      - name: Verify content, routes, metadata and activity
        run: |
          ruby -c _plugins/notebook.rb
          python3 scripts/check-site.py _site
          bundle exec ruby scripts/check-authoring.rb
          git diff --check
          git diff --exit-code -- Gemfile.lock
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
