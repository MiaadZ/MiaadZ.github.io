name: Publish Security Notebook

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy from main after successful validation
        type: boolean
        required: false
        default: false

permissions: {}

env:
  BUNDLE_FROZEN: 'true'
  JEKYLL_ENV: production

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    concurrency:
      group: pages-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # Preservation checks need the immutable original content commit.
          persist-credentials: false
      - name: Read Pages metadata for publication
        id: pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false # Activation remains a manual repository setting.
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          bundler: Gemfile.lock
          bundler-cache: true
      - name: Validate publication policy and root path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path || '' }}
        run: python3 docs/verify-publication.py
      - name: Build production site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path || '' }}
        run: bundle exec jekyll build --trace --destination _site --baseurl "$PAGES_BASE_PATH"
      - name: Verify content, routes, metadata and activity
        run: |
          ruby -c _plugins/notebook.rb
          python3 docs/verify-writeups.py _site
          python3 docs/verify-phase4.py _site
          git diff --exit-code -- Gemfile.lock
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
