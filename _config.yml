title: "S3Z4R Security Notebook"
description: "Technical security writeups, notes, research and projects."
url: "https://miaadz.github.io"
baseurl: ""
lang: en
markdown: kramdown
highlighter: rouge
strict_front_matter: true
plugins: []
sass:
  style: compressed
  sourcemap: never
collections:
  writeups:
    output: true
    permalink: /writeups/:path/
  notes:
    output: true
    permalink: /notes/:path/
  research:
    output: true
    permalink: /research/:path/
  projects:
    output: true
    permalink: /projects/:path/
  topics:
    output: true
    permalink: /topics/:path/
defaults:
  - scope:
      path: ""
    values:
      layout: article
      starred: false
  - scope:
      path: ""
      type: writeups
    values:
      layout: article
      type: writeup
      nav_section: writeups
  - scope:
      path: ""
      type: notes
    values:
      layout: article
      type: note
      nav_section: notes
  - scope:
      path: ""
      type: research
    values:
      layout: article
      type: research
      nav_section: research
  - scope:
      path: ""
      type: projects
    values:
      layout: article
      type: project
      nav_section: projects
  - scope:
      path: ""
      type: topics
    values:
      layout: topic
      nav_section: topics
exclude:
  - AGENTS.md
  - README.md
  - docs
  - .obsidian
  - .bundle
  - .ruby-version
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - node_modules
  - package.json
  - package-lock.json
  - .jekyll-cache
  - .sass-cache
