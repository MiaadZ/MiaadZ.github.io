{% if include.topics.size > 0 %}
<ul class="topic-links">
  {% for topic in include.topics %}
  <li><a href="{{ topic.url | relative_url }}">{{ topic.title | escape }} <span class="topic-count">{{ topic.entry_count }} <span class="visually-hidden">entries</span></span></a></li>
  {% endfor %}
</ul>
{% else %}<p class="empty-state">No topics yet.</p>{% endif %}
